[package]
name = "wgame-typography"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CPU font rasterization and glyph atlases for wgame"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/wgame-typography"
readme = "README.md"
keywords = ["graphics", "gamedev", "async"]
categories = ["graphics", "game-development"]

[dependencies]
wgame-image.workspace = true
euclid.workspace = true
anyhow.workspace = true
swash = { version = "0.2.10", default-features = false, features = [
    "libm",
    "render",
    "scale",
] }
etagere = { version = "0.3.0", features = ["std"] }

[dev-dependencies]
image = { workspace = true, features = ["png"] }
rand = { version = "0.10.2", default-features = false }
