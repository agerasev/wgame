name: CI
on: [push, pull_request]
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: bash scripts/check-features.sh
  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers xvfb
      - run: cargo test --locked -p wgame --lib --test rendering -- --ignored
        env:
          WGPU_BACKEND: vulkan
      - run: xvfb-run -a cargo run --locked -p wgame-examples --bin playground -- --smoke
        env:
          WGPU_BACKEND: vulkan
      - run: cargo test --locked -p wgame-egui --lib -- --ignored
        env:
          WGPU_BACKEND: vulkan
      - run: xvfb-run -a cargo run --locked -p wgame-egui --example playground -- --smoke
        env:
          WGPU_BACKEND: vulkan
