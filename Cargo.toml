[workspace]
members = [
    "wgame",
    "wgame-app",
    "wgame-app-input",
    "wgame-gfx",
    "wgame-gfx-texture",
    "wgame-gfx-shapes",
    "wgame-gfx-typography",
    "wgame-fs",
    "wgame-typography",
    "wgame-image",
    "wgame-shader",
    "wgame-shader-macros",
    "wgame-utils",
    "wgame-macros",
    "wgame-examples",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wgame = { version = "0.1.0", path = "wgame", default-features = false }
wgame-app = { version = "0.1.0", path = "wgame-app" }
wgame-app-input = { version = "0.1.0", path = "wgame-app-input" }
wgame-gfx = { version = "0.1.0", path = "wgame-gfx" }
wgame-gfx-texture = { version = "0.1.0", path = "wgame-gfx-texture" }
wgame-gfx-shapes = { version = "0.1.0", path = "wgame-gfx-shapes" }
wgame-gfx-typography = { version = "0.1.0", path = "wgame-gfx-typography" }
wgame-fs = { version = "0.1.0", path = "wgame-fs" }
wgame-image = { version = "0.1.0", path = "wgame-image" }
wgame-typography = { version = "0.1.0", path = "wgame-typography" }
wgame-shader = { version = "0.1.0", path = "wgame-shader" }
wgame-shader-macros = { version = "0.1.0", path = "wgame-shader-macros" }
wgame-utils = { version = "0.1.0", path = "wgame-utils" }
wgame-macros = { version = "0.1.0", path = "wgame-macros" }
futures = { version = "0.3.34", default-features = false, features = [
    "std",
    "async-await",
] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
bytemuck = "1.25.2"
glam = { version = "0.33.7", features = ["bytemuck"] }
rgb = { version = "0.8.53", default-features = false, features = ["bytemuck"] }
half = { version = "2.7.1", default-features = false, features = ["bytemuck"] }
euclid = { version = "0.22.14", default-features = false }
image = { version = "0.25.10", default-features = false }
hashbrown = { version = "0.17.1", features = ["core", "alloc"] }
smallvec = { version = "1.16.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
derivative = { version = "2.2.0", features = ["use_core"] }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
thiserror = { version = "2.0.20", default-features = false }
anyhow = "1.0.104"
log = "0.4.34"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = "0.3.105"
web-time = "1.1.0"
js-sys = "0.3.105"
proc-macro2 = "1.0.107"
syn = { version = "3.0.5", features = ["full"] }
quote = "1.0.47"
