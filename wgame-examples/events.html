<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wgame: on-demand events</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #06090e; }
    #content { width: 100%; height: 100%; contain: size; }
    /* Override winit's initial inline size so its ResizeObserver follows the page. */
    canvas { display: block; width: 100% !important; height: 100% !important; outline: none; touch-action: none; }
  </style>
  <link data-trunk rel="rust" data-bin="events" />
</head>
<body>
  <div id="content"><canvas id="canvas" tabindex="0" aria-label="Event-driven drawing: Space toggles timer, A toggles animation"></canvas></div>
</body>
</html>
