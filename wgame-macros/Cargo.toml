[package]
name = "wgame-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Application and window entry point macros for wgame"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/wgame-macros"
readme = "README.md"
keywords = ["graphics", "gamedev", "async"]
categories = ["graphics", "game-development"]

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
syn.workspace = true
quote.workspace = true

[dev-dependencies]
# Keep consumer doctests local to avoid a publication dependency cycle.
wgame = { path = "../wgame", default-features = false, features = ["desktop"] }
